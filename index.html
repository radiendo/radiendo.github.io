<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b33">
<title>RadiEndo | Ambiente de aprendizagem</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark"><svg viewBox="0 0 48 48" fill="none" aria-label="Símbolo de dente"><path d="M12 8C6 11 8 22 11 29c2 5 4 12 8 11 4-1 3-12 6-12s2 11 6 12c4 1 6-6 8-11 3-7 5-18-1-21-5-3-9 1-13 1S17 5 12 8Z" stroke="#55d8ea" stroke-width="2.8" stroke-linejoin="round"/><path d="M16 16c4-3 12-3 16 0" stroke="#55d8ea" stroke-width="2" stroke-linecap="round"/></svg></div><div><strong>RadiEndo</strong><small>Radiologia endodôntica</small></div></div>
  <div class="nav-label">Ambiente de aprendizagem</div>
  <nav class="nav" id="nav">
    <button data-page="home"><span class="ico">⌂</span> <span class="lbl">Início</span></button>
    <button data-page="etapa1"><span class="ico">①</span> <span class="lbl">Normalidade</span><span class="st"></span></button>
    <button data-page="etapa2"><span class="ico">②</span> <span class="lbl">Alterações</span><span class="st"></span></button>
    <button data-page="etapa3"><span class="ico">③</span> <span class="lbl">Diagnóstico</span><span class="st"></span></button>
    <button data-page="tutor"><span class="ico">✧</span> <span class="lbl">Tutora virtual</span></button>
  </nav>
  <div class="side-foot" id="sideFoot"></div>
</aside>
<main>
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button><span class="crumb" id="crumb"></span></div>
  <div class="profile"><div class="avatar" id="avatar">··</div><span id="who"></span><button class="btn ghost small-btn" id="sessionBtn"></button></div>
</header>
<div class="content">
  <section class="page" id="home"></section>
  <section class="page" id="etapa1"></section>
  <section class="page" id="etapa2"></section>
  <section class="page" id="etapa3"></section>
  <section class="page" id="tutor"></section>
  <section class="page" id="pesquisador"></section>
</div>
</main>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <form class="dialog" id="loginForm">
    <div class="eyebrow">RadiEndo</div>
    <h2>Identificação do participante</h2>
    <p class="muted">Digite o código individual que você recebeu. Não use nome, matrícula ou e-mail.</p>
    <input id="codeInput" placeholder="Ex.: A07" maxlength="20" autocomplete="off" aria-label="Código do participante">
    <div class="feedback bad" id="codeError"></div>
    <div class="dialog-actions"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" id="visitorBtn">Explorar como visitante</button></div>
    <p class="small muted">Visitantes podem explorar o ambiente, mas nenhuma atividade é registrada.</p>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/geometria.js"></script>
<script src="js/content.js"></script>
<script src="js/diagnostico.js"></script>
<script src="js/data.js"></script>
<script src="js/tutor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
